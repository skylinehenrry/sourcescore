[package]
name = "sourcescore"
version = "0.1.0"
edition = "2021"
description = "Source-preserving graphical MusicXML editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
quick-xml = "0.38"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

